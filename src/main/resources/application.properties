# 随机本地端口，避免与本机其它服务冲突
server.port=0

# ===== 索引器配置 =====
# 节点成功率/延迟滑动窗口大小
indexer.window-size=10
# 连续失败达到该阈值后隔离节点（短暂抖动不达阈值不隔离）
indexer.failure-threshold=3
# 隔离冷却：到期后允许一次真实恢复探测
indexer.recover-cooldown=2s
# 恢复探测超时
indexer.probe-timeout=500ms
# 索引快照文件（区块/日志、位点、固化位点、拒绝留痕、事件账本；重启复现依据）
indexer.state-file=data/index-state.json
